    <!-- Custom CSS -->
    <style>
        :root {
            --primary: #8a2be2;
            --primary-dark: #5b21b6;
            --accent: #ff00ff;
            --accent-light: #ff66ff;
            --neon-blue: #00ffff;
            --neon-purple: #bf00ff;
            --neon-green: #00ff9d;
            --dark: #0a0a0f;
            --darker: #050508;
            --light: #f8fafc;
            --gradient-purple: linear-gradient(135deg, #8a2be2 0%, #5b21b6 50%, #7c3aed 100%);
            --gradient-neon: linear-gradient(135deg, #8a2be2 0%, #bf00ff 50%, #ff00ff 100%);
            --gradient-rainbow: linear-gradient(135deg, #8a2be2 0%, #ff00ff 25%, #00ffff 50%, #00ff9d 75%, #8a2be2 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            background: var(--dark);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: transparent;
            color: var(--light);
            overflow-x: hidden;
            line-height: 1.7;
            position: relative;
            min-height: 100vh;
        }
        
        /* Space background stars ONLY */
        /* Fixed starfield backdrop. There was no rule for the container at all,
           only for its .star children, so the stars were laid out against the
           document instead of sitting behind the page. */
        #space-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        #space-background .star {
            position: absolute;
            border-radius: 50%;
            animation: star-twinkle 3s ease-in-out infinite alternate;
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.5);
        }

        @keyframes star-twinkle {
            0% { 
                opacity: 0.3;
                transform: scale(1);
                box-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
            }
            50% { 
                opacity: 0.7;
                box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
            }
            100% { 
                opacity: 1;
                transform: scale(1.1);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            }
        }
        
        
        /* Custom Container */
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        
        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        
        .gradient-text {
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: gradient-x 3s ease infinite;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2.25rem;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
            letter-spacing: 0.025em;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            z-index: -1;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 20px 40px rgba(138, 43, 226, 0.6);
        }
        
        .btn-primary {
            background: var(--gradient-neon);
            color: white;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: #e2e8f0;
            border: 2px solid rgba(138, 43, 226, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(138, 43, 226, 0.1);
            border-color: var(--primary);
        }
        
        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.1), rgba(255, 0, 255, 0.05));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .card:hover {
            border-color: rgba(138, 43, 226, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 60px rgba(138, 43, 226, 0.2);
            animation: none;
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        /* Form Inputs */
        .form-input {
            width: 100%;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .form-input:focus {
            outline: none;
            border-color: rgba(138, 43, 226, 0.5);
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.1), 0 0 20px rgba(138, 43, 226, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Checkbox */
        .form-checkbox {
            -webkit-appearance: none;
            appearance: none;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .form-checkbox:checked {
            background: var(--gradient-neon);
            border-color: transparent;
        }
        
        .form-checkbox:checked::after {
            content: '\2713';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .divider span {
            padding: 0 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.875rem;
            font-family: 'Poppins', sans-serif;
        }
        
        /* Flash Messages */
        .flash-message {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 1001;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slide-in 0.5s ease-out;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .flash-error {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fecaca;
        }
        
        .flash-success {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            color: #a7f3d0;
        }
        
        /* Back Button */
        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        .back-btn:hover {
            background: rgba(138, 43, 226, 0.1);
            border-color: rgba(138, 43, 226, 0.3);
            color: white;
            transform: translateX(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* Animations */
        @keyframes slide-in {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--darker);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--gradient-neon);
            border-radius: 6px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gradient-rainbow);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .card {
                padding: 2rem 1.5rem;
                margin: 0 1rem;
            }
            
            .back-btn {
                top: 1rem;
                left: 1rem;
                padding: 0.5rem 1rem;
            }
        }

        /* ---- Auth polish (shared across the auth pages) ---- */

        /* Soft purple bloom behind the card */
        .auth-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(900px, 120vw);
            height: min(700px, 90vh);
            background: radial-gradient(ellipse at center,
                rgba(138, 43, 226, 0.20) 0%,
                rgba(191, 0, 255, 0.08) 45%,
                transparent 72%);
            pointer-events: none;
            z-index: -1;
        }

        /* Visible keyboard focus everywhere */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        .btn:focus-visible {
            outline: 2px solid var(--neon-purple);
            outline-offset: 3px;
        }

        /* Input with a leading icon + optional trailing action */
        .field {
            position: relative;
        }

        .field .field-icon {
            position: absolute;
            left: 1.15rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            transition: color 0.25s ease;
            font-size: 0.95rem;
        }

        .field .form-input {
            padding-left: 3rem;
        }

        .field .form-input:focus ~ .field-icon {
            color: #a78bfa;
        }

        .field-toggle {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2.25rem;
            height: 2.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #64748b;
            cursor: pointer;
            transition: color 0.25s ease, background 0.25s ease;
        }

        .field-toggle:hover {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.06);
        }

        .field .form-input[type="password"],
        .field .form-input.has-toggle {
            padding-right: 3.25rem;
        }

        /* Password strength meter (signup / reset) */
        .pw-meter {
            display: flex;
            gap: 0.35rem;
            margin-top: 0.6rem;
        }

        .pw-meter span {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.3s ease;
        }

        .pw-meter.s1 span:nth-child(1) { background: #ef4444; }
        .pw-meter.s2 span:nth-child(-n+2) { background: #f59e0b; }
        .pw-meter.s3 span:nth-child(-n+3) { background: #10b981; }
        .pw-meter.s4 span { background: #10b981; }

        .pw-hint {
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: #64748b;
            font-family: 'Poppins', sans-serif;
            min-height: 1rem;
        }

        /* Submit button loading state */
        .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: auth-spin 0.7s linear infinite;
        }

        @keyframes auth-spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading {
            opacity: 0.85;
            pointer-events: none;
        }

        .btn.loading .btn-spinner { display: inline-block; }
        .btn.loading .btn-label-icon { display: none; }

        /* Trust strip under the card */
        .auth-trust {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.4rem 1.25rem;
            margin-top: 1.5rem;
            color: #64748b;
            font-size: 0.75rem;
            font-family: 'Poppins', sans-serif;
        }

        .auth-trust span {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .auth-trust i { color: #a78bfa; }

        /* Flash toasts fade out rather than vanish */
        .flash-message {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .flash-message.dismissed {
            opacity: 0;
            transform: translateX(24px);
        }

        @media (max-width: 640px) {
            .flash-message {
                left: 1rem;
                right: 1rem;
                max-width: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }


        /* Discord OAuth button (leads the auth cards) */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.9rem 1.25rem;
            margin-bottom: 0.25rem;
            border-radius: 14px;
            background: #5865F2;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border: 1px solid rgba(88, 101, 242, 0.6);
            box-shadow: 0 10px 26px rgba(88, 101, 242, 0.3);
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        .discord-btn:hover {
            background: #4752C4;
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(88, 101, 242, 0.42);
        }

        .discord-btn:active {
            transform: translateY(0);
        }

    </style>
</head>

    <script>
        // Initialize Space Background
        document.addEventListener('DOMContentLoaded', function() {
            function initSpaceBackground() {
                const space = document.getElementById('space-background');
                if (!space) {
                    console.error('Space background element not found!');
                    return;
                }
                
                // Clear any existing stars
                space.innerHTML = '';
                
                // Create twinkling stars
                for (let i = 0; i < 150; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    
                    const size = Math.random() * 3 + 1;
                    const posX = Math.random() * 100;
                    const posY = Math.random() * 100;
                    const duration = Math.random() * 3 + 1;
                    const delay = Math.random() * 2;
                    
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${posX}%`;
                    star.style.top = `${posY}%`;
                    star.style.animationDuration = `${duration}s`;
                    star.style.animationDelay = `${delay}s`;
                    
                    const brightness = Math.random() * 0.5 + 0.5;
                    star.style.backgroundColor = `rgba(255, 255, 255, ${brightness})`;
                    star.style.borderRadius = '50%';
                    star.style.position = 'absolute';
                    star.style.boxShadow = `0 0 ${size * 2}px rgba(255, 255, 255, ${brightness * 0.5})`;
                    
                    space.appendChild(star);
                }
            }
            
            initSpaceBackground();
            
            // Auto-hide flash messages
            const flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach(msg => {
                setTimeout(() => {
                    msg.style.transition = 'all 0.5s ease';
                    msg.style.opacity = '0';
                    msg.style.transform = 'translateX(100%)';
                    setTimeout(() => msg.remove(), 500);
                }, 5000);
            });
            
            // Back button functionality
            const backBtn = document.querySelector('.back-btn');
            if (backBtn && window.history.length <= 1) {
                backBtn.style.display = 'none';
            }
        });
    </script>

    <!-- Shared auth behaviour -->
    <script>
    (function () {
        // Show / hide password
        document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.getAttribute('data-toggle-password'));
                if (!input) return;
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                var icon = btn.querySelector('i');
                if (icon) icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
                input.focus();
            });
        });

        // Password strength hint. Advisory only - the server still validates.
        var pw = document.getElementById('password');
        var meter = document.getElementById('pwMeter');
        var hint = document.getElementById('pwHint');
        if (pw && meter && hint) {
            pw.addEventListener('input', function () {
                var v = pw.value;
                var score = 0;
                if (v.length >= 8) score++;
                if (v.length >= 12) score++;
                if (/[^A-Za-z0-9]/.test(v)) score++;
                if (/[0-9]/.test(v) && /[a-zA-Z]/.test(v)) score++;
                score = Math.min(score, 4);

                meter.className = 'pw-meter' + (v ? ' s' + score : '');
                if (!v) { hint.textContent = ''; return; }
                if (v.length < 8) { hint.textContent = 'Too short - use at least 8 characters.'; return; }
                hint.textContent = ['', 'Weak', 'Fair', 'Good', 'Strong'][score] + ' password';
            });
        }

        // Submit once, with a loading state
        document.querySelectorAll('form').forEach(function (form) {
            form.addEventListener('submit', function () {
                var btn = form.querySelector('button[type="submit"]');
                if (!btn || btn.classList.contains('loading')) return;
                if (!form.checkValidity()) return;
                btn.classList.add('loading');
                var label = btn.querySelector('span:last-child');
                if (label && !label.classList.contains('btn-spinner')) {
                    label.textContent = 'Please wait...';
                }
            });
        });

        // Auto-dismiss flash toasts
        document.querySelectorAll('.flash-message').forEach(function (flash) {
            var hide = function () {
                flash.classList.add('dismissed');
                setTimeout(function () { flash.remove(); }, 400);
            };
            var t = setTimeout(hide, 6000);
            flash.style.cursor = 'pointer';
            flash.addEventListener('click', function () { clearTimeout(t); hide(); });
        });
    })();
    </script>
